<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Handpan with Arpit</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Handpan">
<link rel="apple-touch-icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0f;
    --bg2: #1a1a1a;
    --bg3: #242424;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #f0f0f0;
    --text2: #888;
    --text3: #555;
    --green: #22c55e;
    --green-bg: rgba(34,197,94,0.12);
    --green-border: rgba(34,197,94,0.3);
    --amber: #f59e0b;
    --amber-bg: rgba(245,158,11,0.12);
    --amber-border: rgba(245,158,11,0.3);
    --red: #ef4444;
    --red-bg: rgba(239,68,68,0.1);
    --red-border: rgba(239,68,68,0.25);
    --blue: #3b82f6;
    --blue-bg: rgba(59,130,246,0.1);
    --r: 12px;
    --r2: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow: hidden; }

  /* PIN SCREEN */
  #pin-screen {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100; padding: 40px 24px;
  }
  .pin-logo {
    width: 64px; height: 64px; border-radius: 18px;
    background: var(--green-bg); border: 1px solid var(--green-border);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; margin-bottom: 20px;
  }
  .pin-title { font-size: 22px; font-weight: 600; color: var(--text); }
  .pin-sub { font-size: 14px; color: var(--text2); margin-top: 6px; }
  .pin-dots { display: flex; gap: 16px; margin: 28px 0; }
  .pin-dot {
    width: 14px; height: 14px; border-radius: 50%;
    border: 1.5px solid var(--border2); background: transparent;
    transition: background 0.15s, border-color 0.15s;
  }
  .pin-dot.filled { background: var(--green); border-color: var(--green); }
  .pin-pad { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; width: 240px; }
  .pin-key {
    padding: 16px; border-radius: var(--r); border: 1px solid var(--border);
    background: var(--bg2); font-size: 20px; font-weight: 500;
    cursor: pointer; text-align: center; color: var(--text);
    transition: background 0.1s, transform 0.1s;
    font-family: 'DM Mono', monospace;
  }
  .pin-key:active { background: var(--bg3); transform: scale(0.96); }
  .pin-hint { font-size: 12px; color: var(--text3); margin-top: 20px; }
  .pin-error { color: var(--red); font-size: 13px; margin-top: 8px; animation: shake 0.3s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

  /* MAIN APP */
  #app { height: 100%; display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; }
  .screen { display: none; flex-direction: column; flex: 1; overflow: hidden; }
  .screen.active { display: flex; }

  /* TOP BAR */
  .topbar {
    padding: 14px 18px 12px; background: var(--bg);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
    flex-shrink: 0;
  }
  .topbar-back {
    width: 36px; height: 36px; border-radius: 10px;
    border: 1px solid var(--border); background: transparent;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text); flex-shrink: 0; font-size: 18px;
  }
  .topbar-info { flex: 1; }
  .topbar-title { font-size: 16px; font-weight: 600; color: var(--text); }
  .topbar-sub { font-size: 12px; color: var(--text2); margin-top: 1px; }
  .topbar-action {
    width: 36px; height: 36px; border-radius: 10px;
    border: 1px solid var(--border); background: transparent;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text); font-size: 20px;
  }

  /* SCROLL BODY */
  .body { flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }
  .body::-webkit-scrollbar { display: none; }

  /* NAV BAR */
  .navbar {
    display: grid; grid-template-columns: repeat(5,1fr);
    background: var(--bg); border-top: 1px solid var(--border);
    padding: 8px 0 max(10px, env(safe-area-inset-bottom));
    flex-shrink: 0;
  }
  .ni {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    cursor: pointer; padding: 4px 0; color: var(--text3);
    font-size: 10px; border: none; background: transparent;
    transition: color 0.15s;
  }
  .ni.on { color: var(--green); }
  .ni svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; }

  /* CARDS */
  .card {
    background: var(--bg2); border-radius: var(--r2);
    border: 1px solid var(--border); padding: 14px;
    margin-bottom: 10px; cursor: pointer;
    transition: border-color 0.15s;
  }
  .card:active { border-color: var(--border2); }
  .card-static { cursor: default; }
  .card-row { display: flex; justify-content: space-between; align-items: flex-start; }
  .card-title { font-size: 14px; font-weight: 500; color: var(--text); }
  .card-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }

  /* BADGES */
  .badge { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 500; white-space: nowrap; }
  .bg { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
  .ba { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }
  .br { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
  .bb { background: var(--blue-bg); color: var(--blue); border: 1px solid rgba(59,130,246,0.3); }
  .bgr { background: var(--bg3); color: var(--text2); border: 1px solid var(--border); }

  /* STAT GRID */
  .sgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .scard { background: var(--bg2); border-radius: var(--r); border: 1px solid var(--border); padding: 13px; }
  .slabel { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 4px; }
  .sval { font-size: 20px; font-weight: 600; color: var(--text); font-family: 'DM Mono', monospace; }
  .sval.g { color: var(--green); }
  .sval.a { color: var(--amber); }
  .sval.r { color: var(--red); }

  /* HERO PROFIT */
  .profit-hero {
    background: var(--green-bg); border: 1px solid var(--green-border);
    border-radius: var(--r2); padding: 16px; margin-bottom: 14px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .ph-label { font-size: 12px; color: var(--green); }
  .ph-sub { font-size: 11px; color: rgba(34,197,94,0.7); margin-top: 2px; }
  .ph-val { font-size: 28px; font-weight: 600; color: var(--green); font-family: 'DM Mono', monospace; }

  /* ALERT */
  .alert {
    border-radius: var(--r); padding: 12px 14px; margin-bottom: 12px;
    display: flex; align-items: flex-start; gap: 10px;
  }
  .alert-w { background: var(--amber-bg); border: 1px solid var(--amber-border); }
  .alert-w .at { font-size: 13px; color: var(--amber); font-weight: 500; }
  .alert-w .as { font-size: 12px; color: rgba(245,158,11,0.8); margin-top: 2px; }
  .alert-g { background: var(--green-bg); border: 1px solid var(--green-border); }
  .alert-g .at { font-size: 13px; color: var(--green); font-weight: 500; }
  .alert-g .as { font-size: 12px; color: rgba(34,197,94,0.8); margin-top: 2px; }

  /* UPCOMING HERO */
  .upcoming-hero {
    background: var(--bg2); border: 1.5px solid var(--green);
    border-radius: var(--r2); padding: 14px; margin-bottom: 14px;
  }
  .uh-tag { font-size: 11px; color: var(--green); font-weight: 500; margin-bottom: 6px; display: flex; align-items: center; gap: 5px; }
  .uh-title { font-size: 15px; font-weight: 600; color: var(--text); }
  .uh-date { font-size: 12px; color: var(--text2); margin-top: 2px; }

  /* DIVIDER */
  .div { height: 1px; background: var(--border); margin: 10px 0; }

  /* SECTION LABEL */
  .sec { font-size: 11px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.7px; margin: 14px 0 8px; }

  /* DETAIL ROWS */
  .drow { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .drow:last-child { border-bottom: none; }
  .dk { color: var(--text2); }
  .dv { color: var(--text); font-weight: 500; text-align: right; }

  /* PROGRESS BAR */
  .pbar { height: 5px; background: var(--bg3); border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .pfill { height: 100%; border-radius: 3px; background: var(--green); transition: width 0.4s; }

  /* AVATAR */
  .av {
    width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; flex-shrink: 0;
    font-family: 'DM Mono', monospace;
  }
  .av-g { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
  .av-b { background: var(--blue-bg); color: var(--blue); border: 1px solid rgba(59,130,246,0.3); }
  .av-a { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }
  .av-p { background: rgba(168,85,247,0.1); color: #a855f7; border: 1px solid rgba(168,85,247,0.3); }

  /* TAGS */
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--bg3); color: var(--text2); border: 1px solid var(--border); display: inline-block; margin: 2px 2px 0 0; }
  .tag-g { background: var(--green-bg); color: var(--green); border-color: var(--green-border); }
  .tag-p { background: rgba(168,85,247,0.1); color: #a855f7; border-color: rgba(168,85,247,0.3); }
  .tag-a { background: var(--amber-bg); color: var(--amber); border-color: var(--amber-border); }

  /* FORMS */
  .fg { margin-bottom: 13px; }
  .fl { font-size: 12px; color: var(--text2); margin-bottom: 5px; display: block; }
  .fi {
    width: 100%; padding: 10px 12px; border-radius: var(--r);
    border: 1px solid var(--border2); background: var(--bg2);
    font-size: 14px; color: var(--text); font-family: 'DM Sans', sans-serif;
    transition: border-color 0.15s;
  }
  .fi:focus { outline: none; border-color: var(--green); }
  .fi-half { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 13px; }
  .btnp {
    width: 100%; padding: 12px; border-radius: var(--r);
    background: var(--green); color: #000; border: none;
    font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 4px;
    font-family: 'DM Sans', sans-serif; transition: opacity 0.15s, transform 0.1s;
  }
  .btnp:active { opacity: 0.85; transform: scale(0.99); }
  .btn-outline {
    width: 100%; padding: 11px; border-radius: var(--r);
    background: transparent; color: var(--green);
    border: 1px solid var(--green-border);
    font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 8px;
    font-family: 'DM Sans', sans-serif;
  }

  /* FAB */
  .fab {
    position: fixed; bottom: 80px; right: 20px;
    width: 50px; height: 50px; border-radius: 50%;
    background: var(--green); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: #000; font-size: 24px; z-index: 10;
    transition: transform 0.15s, opacity 0.15s;
    box-shadow: 0 4px 20px rgba(34,197,94,0.3);
  }
  .fab:active { transform: scale(0.92); }

  /* TABS */
  .tab-row { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 2px; }
  .tab-row::-webkit-scrollbar { display: none; }
  .tab {
    padding: 7px 14px; border-radius: 20px; font-size: 13px;
    border: 1px solid var(--border); background: transparent;
    cursor: pointer; color: var(--text2); white-space: nowrap;
    transition: all 0.15s; font-family: 'DM Sans', sans-serif;
  }
  .tab.on { background: var(--green); color: #000; border-color: var(--green); font-weight: 500; }

  /* BAR CHART */
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
  .bar-label { font-size: 12px; color: var(--text2); width: 90px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { flex: 1; height: 7px; background: var(--bg3); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; background: var(--green); transition: width 0.6s cubic-bezier(.4,0,.2,1); }
  .bar-val { font-size: 12px; color: var(--text); font-weight: 500; width: 56px; text-align: right; flex-shrink: 0; font-family: 'DM Mono', monospace; }

  /* INSIGHT CARDS */
  .igrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .icard { background: var(--bg2); border-radius: var(--r); border: 1px solid var(--border); padding: 13px; }
  .inum { font-size: 22px; font-weight: 600; color: var(--text); font-family: 'DM Mono', monospace; }
  .ilabel { font-size: 12px; color: var(--text2); margin-top: 3px; }
  .itrend { font-size: 11px; margin-top: 5px; color: var(--green); }

  /* LOADING */
  .loading {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 50px 20px; gap: 12px;
  }
  .spinner {
    width: 28px; height: 28px; border: 2px solid var(--border2);
    border-top-color: var(--green); border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 13px; color: var(--text2); }

  /* EMPTY STATE */
  .empty { text-align: center; padding: 40px 20px; }
  .empty-icon { font-size: 36px; margin-bottom: 10px; }
  .empty-text { font-size: 13px; color: var(--text2); }

  /* PARTICIPANT ROW */
  .prow { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .prow:last-child { border-bottom: none; }

  /* TOAST */
  .toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--bg3); border: 1px solid var(--border2);
    color: var(--text); font-size: 13px; padding: 10px 18px;
    border-radius: 20px; z-index: 200; opacity: 0;
    transition: all 0.25s; pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- PIN SCREEN -->
<div id="pin-screen">
  <div class="pin-logo">🥁</div>
  <div class="pin-title">Handpan with Arpit</div>
  <div class="pin-sub">Enter your PIN to continue</div>
  <div class="pin-dots">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
  </div>
  <div class="pin-pad">
    <button class="pin-key" onclick="pinTap('1')">1</button>
    <button class="pin-key" onclick="pinTap('2')">2</button>
    <button class="pin-key" onclick="pinTap('3')">3</button>
    <button class="pin-key" onclick="pinTap('4')">4</button>
    <button class="pin-key" onclick="pinTap('5')">5</button>
    <button class="pin-key" onclick="pinTap('6')">6</button>
    <button class="pin-key" onclick="pinTap('7')">7</button>
    <button class="pin-key" onclick="pinTap('8')">8</button>
    <button class="pin-key" onclick="pinTap('9')">9</button>
    <div></div>
    <button class="pin-key" onclick="pinTap('0')">0</button>
    <button class="pin-key" onclick="pinDel()">⌫</button>
  </div>
  <div class="pin-hint">Default PIN: 1234</div>
  <div id="pin-error" class="pin-error" style="display:none">Wrong PIN. Try again.</div>
</div>

<!-- MAIN APP -->
<div id="app" style="display:none">

  <!-- HOME -->
  <div class="screen active" id="s-home">
    <div class="topbar">
      <div class="topbar-info">
        <div class="topbar-title">Handpan with Arpit</div>
        <div class="topbar-sub" id="home-date">Loading...</div>
      </div>
      <button class="topbar-action" onclick="go('s-settings')">⚙️</button>
    </div>
    <div class="body" id="home-body">
      <div class="loading"><div class="spinner"></div><div class="loading-text">Loading your data...</div></div>
    </div>
    <button class="fab" onclick="go('s-add-ws')">＋</button>
    <nav class="navbar">
      <button class="ni on" onclick="go('s-home')"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Home</button>
      <button class="ni" onclick="go('s-workshops')"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Workshops</button>
      <button class="ni" onclick="go('s-people')"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>People</button>
      <button class="ni" onclick="go('s-finance')"><svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>Finances</button>
      <button class="ni" onclick="go('s-insights')"><svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>Insights</button>
    </nav>
  </div>

  <!-- WORKSHOPS -->
  <div class="screen" id="s-workshops">
    <div class="topbar">
      <div class="topbar-title">Workshops</div>
      <button class="topbar-action" onclick="go('s-add-ws')">＋</button>
    </div>
    <div class="body" id="workshops-body">
      <div class="loading"><div class="spinner"></div><div class="loading-text">Loading workshops...</div></div>
    </div>
    <button class="fab" onclick="go('s-add-ws')">＋</button>
    <nav class="navbar">
      <button class="ni" onclick="go('s-home')"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Home</button>
      <button class="ni on" onclick="go('s-workshops')"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Workshops</button>
      <button class="ni" onclick="go('s-people')"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>People</button>
      <button class="ni" onclick="go('s-finance')"><svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>Finances</button>
      <button class="ni" onclick="go('s-insights')"><svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>Insights</button>
    </nav>
  </div>

  <!-- WORKSHOP DETAIL -->
  <div class="screen" id="s-ws-detail">
    <div class="topbar">
      <button class="topbar-back" onclick="back()">←</button>
      <div class="topbar-info">
        <div class="topbar-title" id="wsd-title">Workshop</div>
        <div class="topbar-sub" id="wsd-date"></div>
      </div>
    </div>
    <div class="body" id="wsd-body">
      <div class="loading"><div class="spinner"></div></div>
    </div>
    <nav class="navbar">
